version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: jd-sekuwa-rms:latest
    container_name: jdsekuwa_app
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - app_network

  # Optional local PostgreSQL database if self-hosting database instead of Supabase managed DB
  # db:
  #   image: postgres:16-alpine
  #   container_name: jdsekuwa_db
  #   restart: always
  #   environment:
  #     POSTGRES_USER: ${POSTGRES_USER:-jdsekuwa}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jdsekuwa_secure_pass}
  #     POSTGRES_DB: ${POSTGRES_DB:-jdsekuwa_rms}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   networks:
  #     - app_network

networks:
  app_network:
    driver: bridge

